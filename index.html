<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>全国 災害情報統合ダッシュボード</title><style>:root{--bg:#f3f6fa;--ink:#101828;--muted:#667085;--line:#e4e7ec;--green:#12b76a;--yellow:#fdb022;--orange:#f79009;--red:#d92d20;--purple:#7f56d9;--blue:#1570ef;--navy:#0b1220}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--navy);color:#fff;padding:14px;position:sticky;top:0;z-index:10}.head,main{max-width:1180px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center}.title{font-size:18px;font-weight:900}.sub,.status{font-size:11px;color:#cbd5e1}main{padding:12px}.areaTabs,.prefTabs{display:flex;gap:7px;overflow:auto;padding:4px 0 8px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;white-space:nowrap;font-weight:800;font-size:12px}.tab.on{background:var(--navy);color:#fff}.prefBox{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px;margin-bottom:10px}.prefTabs{flex-wrap:wrap}.refresh{display:flex;justify-content:space-between;align-items:center;background:#eef4ff;border:1px solid #c7d7fe;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:12px}.btn{border:0;background:var(--blue);color:#fff;padding:9px 12px;border-radius:9px;font-weight:800}.summary{background:#fff;border:1px solid var(--line);border-left:7px solid var(--green);border-radius:12px;padding:12px;margin-bottom:10px}.section{font-size:16px;margin:15px 2px 8px}.regions,.grid{display:grid;gap:9px}.regions{grid-template-columns:repeat(7,1fr)}.region,.card{background:#fff;border:2px solid var(--line);border-radius:13px;padding:11px}.region{text-align:center;min-height:92px}.region strong{display:block;font-size:14px}.region .rstatus{font-size:19px;font-weight:900;margin:5px 0}.region small,.meta{font-size:11px;color:var(--muted);line-height:1.45}.grid{grid-template-columns:repeat(4,1fr)}.card{min-height:135px}.card h3{font-size:14px;margin:0 0 8px;display:flex;justify-content:space-between}.badge{font-size:10px;background:#f2f4f7;border-radius:99px;padding:4px 6px;color:#475467}.big{font-size:21px;font-weight:900}.lv0{border-color:var(--green)}.lv0 .big,.lv0 .rstatus{color:var(--green)}.lv1{border-color:var(--yellow);background:#fffdf3}.lv1 .big,.lv1 .rstatus{color:#b54708}.lv2{border-color:var(--orange);background:#fff8ed}.lv2 .big,.lv2 .rstatus{color:var(--orange)}.lv3{border-color:var(--red);background:#fff5f5}.lv3 .big,.lv3 .rstatus{color:var(--red)}.lv4{border-color:var(--purple);background:#f9f5ff}.lv4 .big,.lv4 .rstatus{color:var(--purple)}footer{font-size:11px;color:var(--muted);padding:18px 2px;line-height:1.6}@media(max-width:900px){.regions{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.regions{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.prefTabs{flex-wrap:nowrap}.title{font-size:15px}.sub{display:none}}</style></head><body><header><div class="head"><div><div class="title" id="pageTitle">福島県 災害情報統合ダッシュボード</div><div class="sub">全国47都道府県を選択・福島県は7地域を詳細表示</div></div><div class="status">5分更新 <span id="clock"></span></div></div></header><main><div class="areaTabs" id="areaTabs"></div><div class="prefBox"><div class="prefTabs" id="prefTabs"></div></div><div class="refresh"><div><b id="selected">福島県</b>　自動更新：5分ごと<br>データ：<span id="updated">--</span></div><button class="btn" id="refreshBtn">↻ 更新</button></div><div class="summary" id="summary"><b>取得中…</b><small>公式情報を読み込んでいます。</small></div><div id="fukushimaPanel"><h2 class="section">福島県 7地域リアルタイム状況</h2><div class="regions" id="regions"></div></div><h2 class="section">災害情報</h2><div class="grid" id="grid"></div><footer>🟢平常／🟡注意／🟠警戒／🔴警報／🟣特別警報・緊急度の高い情報。福島県は気象庁データから7地域を自動着色します。福島県以外は現在、全国版の公式情報入口として表示し、順次都道府県別の自動判定へ拡張します。災害時は必ず発表元の公式情報を確認してください。</footer></main><script>
const I=300000,groups={'北海道':['北海道'],'東北':['青森県','岩手県','宮城県','秋田県','山形県','福島県'],'関東':['茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県'],'中部':['新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県'],'近畿':['三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県'],'中国':['鳥取県','島根県','岡山県','広島県','山口県'],'四国':['徳島県','香川県','愛媛県','高知県'],'九州・沖縄':['福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県']};let pref='福島県',area='東北';const defs=[['weather','🌧️','気象警戒','https://www.jma.go.jp/bosai/warning/'],['earthquake','🌎','地震','https://www.jma.go.jp/bosai/map.html#contents=earthquake_map'],['tsunami','🌊','津波','https://www.jma.go.jp/bosai/map.html#contents=tsunami'],['landslide','⛰️','土砂災害','https://www.jma.go.jp/bosai/risk/'],['flood','🌊','河川氾濫','https://www.jma.go.jp/bosai/flood/'],['evacuation','🏃','避難情報','https://www.jma.go.jp/bosai/'],['road','🚧','道路','https://www.jartic.or.jp/'],['power','⚡','停電','https://www.jaero.or.jp/sogo/detail/cat-03-02.html']];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(x){if(!x)return'--';return new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(x))}function tabs(){areaTabs.innerHTML=Object.keys(groups).map(x=>`<button class="tab ${x===area?'on':''}" onclick="setArea('${x}')">${x}</button>`).join('');prefTabs.innerHTML=groups[area].map(x=>`<button class="tab ${x===pref?'on':''}" onclick="setPref('${x}')">${x}</button>`).join('')}function setArea(x){area=x;if(!groups[x].includes(pref))pref=groups[x][0];tabs();renderSelection()}function setPref(x){pref=x;tabs();renderSelection()}function renderSelection(){selected.textContent=pref;pageTitle.textContent=pref+' 災害情報統合ダッシュボード';fukushimaPanel.style.display=pref==='福島県'?'block':'none';load()}
function genericCards(){return defs.map(([k,ic,n,u])=>`<div class="card lv0"><h3>${ic} ${n}<span class="badge">公式</span></h3><div class="big">公式情報</div><div class="meta">${esc(pref)}の最新情報を確認</div><div class="meta"><a href="${u}" target="_blank" rel="noopener">公式情報を開く →</a></div></div>`).join('')}
async function load(){refreshBtn.disabled=true;refreshBtn.textContent='更新中…';if(pref!=='福島県'){updated.textContent=fmt(new Date());summary.style.borderLeftColor='#1570ef';summary.querySelector('b').textContent='🔵 '+pref+'を表示中';summary.querySelector('small').textContent='全国版：公式情報への入口を表示しています';grid.innerHTML=genericCards();refreshBtn.disabled=false;refreshBtn.textContent='↻ 更新';return}try{let r=await fetch('data/jma.json?t='+Date.now(),{cache:'no-store'}),a=await r.json();updated.textContent=fmt(a.updated);let rr=a.regions||{};regions.innerHTML=['県北','県中','県南','会津','南会津','相双','いわき'].map(n=>{let d=rr[n]||{level:0,label:'平常',items:[]};return `<div class="region lv${d.level||0}"><strong>${n}</strong><div class="rstatus">${esc(d.label)}</div><small>${esc(d.items?.join('・')||'警報・注意報なし')}</small></div>`}).join('');let max=0;grid.innerHTML=defs.map(([k,ic,n,u])=>{let d=a[k]||{level:0,label:'公式情報'};max=Math.max(max,d.level||0);let detail=k==='weather'?(d.items?.join('・')||'発表なし'):k==='earthquake'?([d.hypocenter,d.magnitude?'M'+d.magnitude:''].filter(Boolean).join(' / ')||'直近情報なし'):(d.detail||'公式情報を確認');return `<div class="card lv${d.level||0}"><h3>${ic} ${n}<span class="badge">LIVE</span></h3><div class="big">${esc(d.label)}</div><div class="meta">${esc(detail)}</div><div class="meta"><a href="${d.url||u}" target="_blank">公式情報 →</a></div></div>`}).join('');let t=['🟢 大きな警戒情報なし','🟡 注意情報あり','🟠 警戒情報あり','🔴 警報等あり','🟣 緊急度の高い情報あり'];summary.style.borderLeftColor=['#12b76a','#fdb022','#f79009','#d92d20','#7f56d9'][max];summary.querySelector('b').textContent=t[max];summary.querySelector('small').textContent='福島県7地域を含む自動判定・最終更新 '+fmt(a.updated)}catch(e){summary.querySelector('b').textContent='⚪ データ取得を確認してください';grid.innerHTML=genericCards()}finally{refreshBtn.disabled=false;refreshBtn.textContent='↻ 更新'}}function tick(){clock.textContent=new Intl.DateTimeFormat('ja-JP',{hour:'2-digit',minute:'2-digit'}).format(new Date())}tabs();tick();load();setInterval(tick,30000);setInterval(load,I);refreshBtn.onclick=load;</script></body></html>
