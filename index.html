<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>全国 災害情報ダッシュボード</title><style>:root{--bg:#f3f6fa;--ink:#101828;--muted:#667085;--line:#e4e7ec;--green:#12b76a;--yellow:#fdb022;--orange:#f79009;--red:#d92d20;--purple:#7f56d9;--blue:#1570ef;--navy:#0b1220}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--navy);color:white;padding:14px;position:sticky;top:0;z-index:10}.head,main{max-width:1180px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center}.title{font-size:18px;font-weight:900}.sub,.status{font-size:11px;color:#cbd5e1}main{padding:12px}.areaTabs,.prefTabs{display:flex;gap:7px;overflow:auto;padding:4px 0 8px}.tab{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;white-space:nowrap;font-weight:800;font-size:12px}.area.on{background:var(--navy);color:#fff}.p0{border-color:var(--green);background:#ecfdf3}.p1{border-color:var(--yellow);background:#fffaeb}.p2{border-color:var(--orange);background:#fff4e5}.p3{border-color:var(--red);background:#fef3f2;color:#b42318}.p4{border-color:var(--purple);background:#f4ebff;color:#6941c6}.pref.on{box-shadow:0 0 0 3px #1570ef55}.prefBox,.summary,.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px;margin-bottom:10px}.prefTabs{flex-wrap:wrap}.legend{font-size:11px;color:var(--muted);margin:2px 2px 8px}.refresh{display:flex;justify-content:space-between;align-items:center;background:#eef4ff;border:1px solid #c7d7fe;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:12px}.btn{border:0;background:var(--blue);color:#fff;padding:9px 12px;border-radius:9px;font-weight:800}.summary{border-left:7px solid var(--green)}.big{font-size:24px;font-weight:900}.meta{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}.regions{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.region{border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center}.region strong{display:block}.rstatus{font-size:18px;font-weight:900;margin:5px}.lv0{border-color:var(--green)}.lv1{border-color:var(--yellow);background:#fffaeb}.lv2{border-color:var(--orange);background:#fff4e5}.lv3{border-color:var(--red);background:#fef3f2}.lv4{border-color:var(--purple);background:#f4ebff}.section{font-size:15px;margin:14px 2px 8px}footer{font-size:11px;color:var(--muted);line-height:1.6;padding:15px 2px}@media(max-width:850px){.regions{grid-template-columns:repeat(4,1fr)}}@media(max-width:500px){.prefTabs{flex-wrap:nowrap}.regions{grid-template-columns:repeat(2,1fr)}.title{font-size:15px}.sub{display:none}}</style></head><body><header><div class="head"><div><div class="title" id="pageTitle">全国 災害情報ダッシュボード</div><div class="sub">47都道府県の警報・注意報を5分ごとに自動判定</div></div><div class="status">5分更新 <span id="clock"></span></div></div></header><main><div class="areaTabs" id="areaTabs"></div><div class="prefBox"><div class="prefTabs" id="prefTabs"></div><div class="legend">🟢平常　🟡注意報　🟠警戒情報　🔴警報　🟣特別警報</div></div><div class="refresh"><div><b id="selected">福島県</b>　データ更新：<span id="updated">--</span></div><button class="btn" id="refreshBtn">↻ 更新</button></div><div class="summary" id="summary"><b>取得中…</b><small>気象庁データを読み込んでいます。</small></div><div class="panel"><div class="big" id="prefStatus">--</div><div class="meta" id="prefDetail">--</div><div class="meta"><a href="https://www.jma.go.jp/bosai/warning/" target="_blank" rel="noopener">気象庁 警報・注意報 →</a></div></div><div id="fukushimaPanel" style="display:none"><h2 class="section">福島県 7地域</h2><div class="regions" id="regions"></div></div><footer>都道府県タブは気象庁の警報・注意報XMLをもとに自動着色します。選択した都道府県の発表状況を中央に表示します。福島県はさらに7地域に分けて表示します。自動表示は補助情報です。災害時は必ず気象庁・自治体の公式発表を確認してください。</footer></main><script>
const I=300000,groups={'北海道':['北海道'],'東北':['青森県','岩手県','宮城県','秋田県','山形県','福島県'],'関東':['茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県'],'中部':['新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県'],'近畿':['三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県'],'中国':['鳥取県','島根県','岡山県','広島県','山口県'],'四国':['徳島県','香川県','愛媛県','高知県'],'九州・沖縄':['福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県']};let pref='福島県',area='東北',data={prefectures:{}};const icons=['🟢','🟡','🟠','🔴','🟣'];function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(x){if(!x)return'--';return new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(x))}function tabs(){areaTabs.innerHTML=Object.keys(groups).map(x=>`<button class="tab area ${x===area?'on':''}" onclick="setArea('${x}')">${x}</button>`).join('');prefTabs.innerHTML=groups[area].map(x=>{let d=data.prefectures?.[x]||{level:0};return `<button class="tab pref p${d.level||0} ${x===pref?'on':''}" onclick="setPref('${x}')">${icons[d.level||0]} ${x}</button>`}).join('')}function setArea(x){area=x;if(!groups[x].includes(pref))pref=groups[x][0];tabs();render()}function setPref(x){pref=x;tabs();render()}function render(){selected.textContent=pref;pageTitle.textContent=pref+' 災害情報ダッシュボード';let d=data.prefectures?.[pref]||{level:0,label:'データ待機',items:[]};prefStatus.textContent=icons[d.level||0]+' '+(d.label||'平常');prefDetail.textContent=d.items?.join('・')||'発表中の警報・注意報なし';summary.style.borderLeftColor=['#12b76a','#fdb022','#f79009','#d92d20','#7f56d9'][d.level||0];summary.querySelector('b').textContent=icons[d.level||0]+' '+pref+'：'+(d.label||'平常');summary.querySelector('small').textContent='気象庁データ 最終更新 '+fmt(data.updated);fukushimaPanel.style.display=pref==='福島県'?'block':'none';if(pref==='福島県'){let rr=data.regions||{};regions.innerHTML=['県北','県中','県南','会津','南会津','相双','いわき'].map(n=>{let r=rr[n]||{level:0,label:'平常',items:[]};return `<div class="region lv${r.level||0}"><strong>${n}</strong><div class="rstatus">${icons[r.level||0]} ${esc(r.label)}</div><small>${esc(r.items?.join('・')||'発表なし')}</small></div>`}).join('')}}async function load(){refreshBtn.disabled=true;refreshBtn.textContent='更新中…';try{let r=await fetch('data/jma.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;data=await r.json();updated.textContent=fmt(data.updated);tabs();render()}catch(e){summary.querySelector('b').textContent='⚪ データ取得を確認してください';summary.querySelector('small').textContent='気象庁公式情報をご確認ください'}finally{refreshBtn.disabled=false;refreshBtn.textContent='↻ 更新'}}function tick(){clock.textContent=new Intl.DateTimeFormat('ja-JP',{hour:'2-digit',minute:'2-digit'}).format(new Date())}tabs();tick();load();setInterval(tick,30000);setInterval(load,I);refreshBtn.onclick=load;</script></body></html>
