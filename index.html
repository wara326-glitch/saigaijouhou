<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>福島県 災害情報統合ダッシュボード</title><style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--red:#d92d20;--orange:#f79009;--yellow:#fdb022;--green:#12b76a;--purple:#7f56d9;--blue:#1570ef;--navy:#0b1220}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}header{background:var(--navy);color:#fff;padding:15px;position:sticky;top:0;z-index:10}.head{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.title{font-size:19px;font-weight:900}.sub,.status{font-size:11px;color:#cbd5e1}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);margin-right:5px}main{max-width:1180px;margin:auto;padding:12px}.refresh{display:flex;justify-content:space-between;align-items:center;background:#eef4ff;border:1px solid #c7d7fe;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:12px}.btn{border:0;background:var(--blue);color:#fff;padding:9px 12px;border-radius:9px;font-weight:800}.summary{background:#fff;border:1px solid var(--line);border-left:7px solid var(--green);border-radius:12px;padding:12px;margin-bottom:10px}.summary b{display:block}.summary small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px;min-height:142px}.card h3{font-size:14px;margin:0 0 9px;display:flex;justify-content:space-between}.badge{font-size:10px;background:#f2f4f7;border-radius:99px;padding:4px 6px;color:#475467}.big{font-size:22px;font-weight:900}.meta{font-size:12px;color:var(--muted);line-height:1.5;margin-top:7px}.meta a{font-weight:700}.lv0{border-color:var(--green)}.lv0 .big{color:var(--green)}.lv1{border-color:var(--yellow);background:#fffdf3}.lv1 .big{color:#b54708}.lv2{border-color:var(--orange);background:#fff8ed}.lv2 .big{color:var(--orange)}.lv3{border-color:var(--red);background:#fff5f5}.lv3 .big{color:var(--red)}.lv4{border-color:var(--purple);background:#f9f5ff}.lv4 .big{color:var(--purple)}footer{font-size:11px;color:var(--muted);line-height:1.6;padding:18px 2px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:1fr}.title{font-size:16px}.sub{display:none}.refresh{align-items:flex-start}.card{min-height:125px}}
</style></head><body><header><div class="head"><div><div class="title">福島県 災害情報統合ダッシュボード</div><div class="sub">気象・地震・津波・土砂・河川・避難・道路・停電・原子力</div></div><div class="status"><span class="dot"></span>5分更新 <span id="clock"></span></div></div></header><main>
<div class="refresh"><div><b>自動更新：5分ごと</b><br>データ：<span id="updated">--</span></div><button class="btn" id="refreshBtn">↻ 更新</button></div><div class="summary" id="summary"><b>取得中…</b><small>公式情報を読み込んでいます。</small></div><div class="grid" id="grid"></div><footer>🟢平常・公式情報／🟡注意／🟠警戒／🔴警報・避難指示等／🟣特別警報・緊急度の高い情報。気象・地震・津波・土砂・指定河川洪水は気象庁データを自動取得します。避難、道路、停電、原子力は各公式リアルタイム情報への直結表示です。災害時の判断は必ず発表元の公式情報で確認してください。</footer></main><script>
const I=300000, defs=[
['weather','🌧️','気象警戒','気象庁 LIVE','https://www.jma.go.jp/bosai/warning/'],['earthquake','🌎','地震','気象庁 LIVE','https://www.jma.go.jp/bosai/map.html#contents=earthquake_map'],['tsunami','🌊','津波','気象庁 LIVE','https://www.jma.go.jp/bosai/map.html#contents=tsunami'],['landslide','⛰️','土砂災害','気象庁 LIVE','https://www.jma.go.jp/bosai/risk/'],['flood','🌊','河川氾濫','気象庁 LIVE','https://www.jma.go.jp/bosai/flood/'],['evacuation','🏃','避難指示','福島県','https://www.bousai.pref.fukushima.lg.jp/'],['road','🚧','道路通行止め','福島県/国','https://www.pref.fukushima.lg.jp/sec/41035c/dourokisei.html'],['power','⚡','停電','東北電力NW','https://nw.tohoku-epco.co.jp/teideninfo/'],['nuclear','☢️','原子力モニタリング','福島県','https://fukushima-radioactivity.jp/pc/monitoringPostList']];
function fmt(x){if(!x)return'--';return new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(x))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function detail(k,d){if(k==='weather')return d.items?.join('・')||'発表中の警報・注意報なし';if(k==='earthquake')return [d.hypocenter,d.magnitude?'M'+d.magnitude:'',d.published?fmt(d.published):''].filter(Boolean).join(' / ')||'直近の対象情報なし';return d.detail||'公式情報を確認'}
async function load(){let b=document.getElementById('refreshBtn');b.disabled=true;b.textContent='更新中…';try{let r=await fetch('data/jma.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;let all=await r.json();updated.textContent=fmt(all.updated);let max=0;grid.innerHTML=defs.map(([k,ic,name,src,url])=>{let d=all[k]||{level:0,label:'公式情報'};max=Math.max(max,d.level||0);let u=d.url||url;return `<div class="card lv${d.level||0}"><h3>${ic} ${name}<span class="badge">${src}</span></h3><div class="big">${esc(d.label||'平常')}</div><div class="meta">${esc(detail(k,d))}</div><div class="meta"><a href="${u}" target="_blank" rel="noopener">公式情報を開く →</a></div></div>`}).join('');let texts=['🟢 現在、大きな警戒情報は確認されていません','🟡 注意情報があります','🟠 警戒情報があります','🔴 警報・避難等に注意してください','🟣 緊急度の高い情報があります'];summary.style.borderLeftColor=['#12b76a','#fdb022','#f79009','#d92d20','#7f56d9'][max];summary.querySelector('b').textContent=texts[max];summary.querySelector('small').textContent='最終データ更新 '+fmt(all.updated)}catch(e){summary.style.borderLeftColor='#667085';summary.querySelector('b').textContent='⚪ 自動データ取得を確認してください';summary.querySelector('small').textContent='各カードの公式情報リンクをご利用ください。'}finally{b.disabled=false;b.textContent='↻ 更新'}}
function tick(){clock.textContent=new Intl.DateTimeFormat('ja-JP',{hour:'2-digit',minute:'2-digit'}).format(new Date())}tick();setInterval(tick,30000);load();setInterval(load,I);refreshBtn.onclick=load;
</script></body></html>
